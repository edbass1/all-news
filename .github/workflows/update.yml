name: Aggiorna ALL NEWS
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: all-news
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Installa Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Installa Chromium Playwright (fallback)
        run: playwright install chromium --with-deps
      - uses: actions/cache@v4
        with:
          path: cache
          key: articles-${{ github.run_id }}
          restore-keys: articles-
      - run: python -u build.py
        env:
          ALLNEWS_PASS: ${{ secrets.ALLNEWS_PASS }}
      - name: Salva cache traduzioni
        continue-on-error: true
        run: |
          git config user.name "all-news-bot"
          git config user.email "all-news-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Nessuna modifica alla cache"
            exit 0
          fi
          git commit -m "Aggiornamento $(TZ=Europe/Rome date '+%d/%m %H:%M')"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Cache salvata"
              exit 0
            fi
            echo "Push fallito, tentativo $i/3..."
            sleep 5
            git rebase --abort 2>/dev/null || true
          done
          echo "Push cache fallito dopo 3 tentativi (non blocca il deploy)"
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
