name: Aggiorna ALL NEWS
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: all-news
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Salva cache traduzioni
        run: |
          git config user.name "all-news-bot"
          git config user.email "all-news-bot@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || (git commit -m "Aggiornamento $(TZ=Europe/Rome date '+%d/%m %H:%M')" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
